<!-- Header principal de la aplicación -->
<header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 bg-white">

  <!-- Logo de la aplicación -->
  <div class="logo">
    <a routerLink="/dashboard" class="font-display text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent tracking-tight drop-shadow-sm cursor-pointer no-underline hover:opacity-80 transition-opacity">Crumbs</a>
  </div>

  <!-- Navegación por pestañas usando Angular Material -->
  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    <a
      mat-tab-link
      routerLink="/dashboard"
      routerLinkActive
      #homeActive="routerLinkActive"
      [active]="homeActive.isActive"
    >
      Home
    </a>

    <!-- Tab Balance: se activa automáticamente cuando la ruta incluye /balance -->
    <a
      mat-tab-link
      routerLink="/balance"
      routerLinkActive
      #balanceActive="routerLinkActive"
      [active]="balanceActive.isActive"
    >
      Balance
    </a>

    <!-- Tab Perfil: se activa automáticamente cuando la ruta incluye /perfil -->
    <a
      mat-tab-link
      routerLink="/perfil"
      routerLinkActive
      #perfilActive="routerLinkActive"
      [active]="perfilActive.isActive"
    >
      Perfil
    </a>

    <!-- Tab Salir: ejecuta logout sin navegar a una ruta específica de tab -->
    <a
      mat-tab-link
      tabindex="0"
      role="button"
      (click)="logout()"
      (keydown.enter)="logout()"
    >
      Salir
    </a>
  </nav>
</header>

<!-- Panel de referencia requerido por mat-tab-nav-bar -->
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
