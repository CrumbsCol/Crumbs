<div class="flex -space-x-2 overflow-hidden">
  @for (miembro of miembrosVisibles; track miembro.id) {
    <div
      class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-200 border-2 border-white text-xs font-medium text-gray-600"
      title="{{ miembro.nombre }}"
    >
      {{ miembro.nombre.substring(0, 2).toUpperCase() }}
    </div>
  }
  @if (miembrosExtra > 0) {
    <div
      class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 border-2 border-white text-xs font-medium text-gray-500"
      title="{{ miembrosExtra }} más"
    >
      +{{ miembrosExtra }}
    </div>
  }
</div>
