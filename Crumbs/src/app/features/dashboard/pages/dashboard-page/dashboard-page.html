<section class="dashboard-view" aria-label="Panel principal">
  <!-- Cabecera superior: Saludo y botón de agregar -->
  <div class="flex justify-between items-center mb-2">
    <app-welcome-header [nickName]="nickName()"></app-welcome-header>
    
    <button mat-icon-button color="primary" class="hover:bg-primary/10" matTooltip="Unirme con código" aria-label="Unirme con código" (click)="onAgregarSalida()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <!-- Layout stacked: Tabla arriba, botones abajo -->
  <div class="flex flex-col gap-6 mt-6">
    <app-active-salidas-list
      [salidas]="salidasActivas()"
      [isEmpty]="isEmpty()"
      (salidaClick)="onSalidaClick($event)">
    </app-active-salidas-list>

    <app-dashboard-actions
      (crearSalida)="onCrearSalida()">
    </app-dashboard-actions>
  </div>
</section>
