<div class="glass rounded-3xl overflow-hidden mb-6" role="region" aria-label="Mis Salidas Activas">
  <div class="bg-white/30 border-b border-white/40 px-6 py-4">
    <h2 class="font-display text-2xl text-primary drop-shadow-sm tracking-wide m-0">Mis Salidas Activas</h2>
  </div>

  @if (isEmpty()) {
    <div class="p-8 text-center text-primary/70 font-medium" role="status">No tienes salidas activas en este momento.</div>
  } @else {
    <app-table
      [data]="salidas()"
      [columns]="tableColumns"
      (rowClick)="salidaClick.emit($event)">
    </app-table>
  }
</div>
