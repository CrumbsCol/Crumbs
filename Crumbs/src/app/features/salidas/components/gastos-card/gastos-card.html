<!-- Card de Gastos -->
<mat-card class="glass !rounded-3xl mt-4 border-0 shadow-none" appearance="outlined">
  <mat-card-header class="bg-white/30 border-b border-white/40 px-6 py-4 !block">
    <mat-card-title class="font-display text-2xl text-primary drop-shadow-sm tracking-wide m-0">Gastos</mat-card-title>
  </mat-card-header>
  <mat-card-content class="p-0">
    <app-table
      [data]="gastos()"
      [columns]="tableColumns"
      (rowClick)="gastoClick.emit($event)">
      
      <!-- Template personalizado para la columna 'nombre' -->
      <ng-template appTableColumnDef="nombre" let-gasto>
        <div class="flex items-center">
          <span class="font-medium text-gray-800">{{ gasto.nombre }}</span>
          @if (gasto.pagadoPor.id === usuarioActual()?.id) {
            <span class="ml-2 inline-flex items-center rounded-full bg-accent/40 px-2.5 py-0.5 text-xs font-semibold text-primary border border-primary/20 shadow-sm">Yo pagué</span>
          }
        </div>
      </ng-template>

      <!-- Estado vacío personalizado -->
      <div empty-state>
        <p>No hay gastos registrados aún.</p>
      </div>

    </app-table>
  </mat-card-content>
</mat-card>
