  height: 100%;
  pointer-events: none;
  z-index: 1;
}

  transition: var(--mat-tab-animation-duration, 250ms) transform cubic-bezier(0.4, 0, 0.2, 1);
  transform-origin: left;
  opacity: 0;

  border-top-style: solid;
